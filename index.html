<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BEEZALY CERAMICS</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #ece5d8;           /* Теплый овсяный фон */
      --header-bg: #545e54;    /* Точный цвет подложки твоего логотипа */
      --header-text: #ffffff;
      --card-bg: #f5f0e6;      /* Светлая подложка карточки */
      --text-dark: #242422;
      --text-muted: #75756f;
      --accent-btn: #545e54;   /* Кнопка в цвет шапки */
      --accent-btn-text: #fff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg);
      color: var(--text-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* Верхняя плашка */
    header {
      background-color: var(--header-bg);
      color: var(--header-text);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .header-logo {
      height: 46px; /* Увеличенный логотип */
      width: auto;
      max-width: 180px;
      object-fit: contain;
      display: block;
    }
    .header-tag {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      opacity: 0.9;
      font-weight: 500;
    }

    /* Основной контейнер витрины */
    .showcase-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 10px 40px;
    }

    /* Адаптивная плотная сетка */
    /* Мобильный телефон: 3 колонки (разом видно 6-9 изделий) */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px 8px;
    }

    /* Планшеты: 4 колонки */
    @media (min-width: 650px) {
      .grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 16px 12px;
      }
      .showcase-container { padding: 20px 16px 50px; }
    }

    /* Компьютер / ноутбук: 5-6 колонок */
    @media (min-width: 950px) {
      .grid {
        grid-template-columns: repeat(5, 1fr);
        gap: 18px 14px;
      }
    }
    @media (min-width: 1150px) {
      .grid {
        grid-template-columns: repeat(6, 1fr);
      }
    }

    /* Карточка изделия */
    .card {
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      transition: transform 0.12s ease;
    }
    .card:active {
      transform: scale(0.98);
    }

    .card-img-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #ded7c9;
      position: relative;
      cursor: pointer;
    }
    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Бейджи */
    .badge-new {
      position: absolute;
      top: 5px;
      left: 5px;
      background: rgba(84, 94, 84, 0.9);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 2px 5px;
      border-radius: 4px;
    }
    .badge-sold {
      position: absolute;
      top: 5px;
      left: 5px;
      background: rgba(40, 40, 38, 0.88);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 2px 5px;
      border-radius: 4px;
    }

    /* Нижняя плашка под фото */
    .card-info {
      padding: 8px 6px 8px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      text-align: center;
    }
    .card-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      line-height: 1.25;
      color: var(--text-dark);
      margin-bottom: 2px;
      /* Обрезаем длинный текст до 2 строк */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 26px;
    }
    .card-price {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 6px;
    }
    .card-btn {
      background: var(--accent-btn);
      color: var(--accent-btn-text);
      text-decoration: none;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 6px 0;
      border-radius: 6px;
      display: block;
      margin-top: auto;
    }
    .card-btn:active {
      opacity: 0.85;
    }

    /* Состояние Продано */
    .card.sold img {
      filter: grayscale(40%) opacity(0.7);
    }
    .card.sold .card-price {
      color: var(--text-muted);
    }
    .card.sold .card-btn {
      background: #c2bcb0;
      pointer-events: none;
      color: #706b60;
    }

    /* Модальная шторка (детали и ракурсы) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(30, 32, 30, 0.65);
      backdrop-filter: blur(6px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 1000;
    }
    .modal-overlay.active {
      display: flex;
    }

    .modal-sheet {
      background: #fbf9f4;
      width: 100%;
      max-width: 480px;
      max-height: 88vh;
      border-radius: 20px 20px 0 0;
      padding: 20px 18px 28px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.22s ease-out;
      box-shadow: 0 -4px 25px rgba(0,0,0,0.12);
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-gallery {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      margin-bottom: 14px;
      padding-bottom: 4px;
    }
    .modal-gallery::-webkit-scrollbar { display: none; }
    .modal-gallery img {
      width: 82%;
      flex-shrink: 0;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      object-fit: cover;
      scroll-snap-align: center;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 3px;
      text-align: center;
    }
    .modal-price {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-dark);
      text-align: center;
      margin-bottom: 12px;
    }
    .modal-desc {
      font-size: 13px;
      line-height: 1.45;
      color: #3b3b38;
      margin-bottom: 10px;
      white-space: pre-line;
    }
    .modal-params {
      font-size: 12px;
      color: var(--text-muted);
      background: #ede7dc;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .modal-buy-btn {
      background: var(--header-bg);
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      display: block;
    }
    .modal-close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
      padding: 12px 0 0;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Шапка в тон логотипа -->
  <header>
    <img src="logo.png" alt="Beezaly Ceramics" class="header-logo">
    <span class="header-tag">Каталог</span>
  </header>

  <div class="showcase-container">
    <div class="grid" id="products-grid"></div>
  </div>

  <!-- Шторка детального просмотра -->
  <div class="modal-overlay" id="modal">
    <div class="modal-sheet">
      <div class="modal-gallery" id="modal-gallery"></div>
      <h2 class="modal-title" id="modal-title"></h2>
      <div class="modal-price" id="modal-price"></div>
      <div class="modal-desc" id="modal-desc"></div>
      <div class="modal-params" id="modal-params"></div>
      <a class="modal-buy-btn" id="modal-buy-btn" href="#">Забрать в @beezaly_order</a>
      <button class="modal-close-btn" onclick="closeModal()">Закрыть</button>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // СПИСОК ТОВАРОВ
    // Я вписал файлы из твоего GitHub, чтобы ты сразу увидела плотную витрину.
    // Когда скинешь описания — просто заменим названия и цены!
    // -------------------------------------------------------------
    const products = [
      {
        id: 1,
        title: "Ваза песчаник",
        price: "4 490 ₽",
        status: "available",
        isNew: true,
        photos: ["Vase.jpg"],
        desc: "Ваза песчаник. Для сухоцветов.",
        params: "• Доставка: Ozon / СДЭК / Яндекс<br>• Бронь 15 минут"
      },
      {
        id: 2,
        title: "Пиала фактурная",
        price: "2 400 ₽",
        status: "available",
        isNew: true,
        photos: ["bowl.jpg", "full-bowl.jpg"],
        desc: "Ручная лепка, рельефная каменная поверхность.",
        params: "• Доставка: Ozon / СДЭК / Яндекс<br>• Бронь 15 минут"
      },
      {
        id: 3,
        title: "Кружка зеленая",
        price: "2 800 ₽",
        status: "available",
        isNew: false,
        photos: ["green-cup.jpg"],
        desc: "Удобная кружка на каждый день.",
        params: "• Доставка: Ozon / СДЭК / Яндекс<br>• Бронь 15 минут"
      },
      {
        id: 4,
        title: "Кружка серая",
        price: "2 800 ₽",
        status: "available",
        isNew: false,
        photos: ["gray-cup.jpg"],
        desc: "Матовая тактильная поверхность.",
        params: "• Доставка: Ozon / СДЭК / Яндекс<br>• Бронь 15 минут"
      },
      {
        id: 5,
        title: "Бидон",
        price: "3 900 ₽",
        status: "available",
        isNew: false,
        photos: ["Bidon.jpg", "Little-bidon.jpg"],
        desc: "Авторская форма.",
        params: "• Доставка: Ozon / СДЭК / Яндекс<br>• Бронь 15 минут"
      },
      {
        id: 6,
        title: "Тарелка 21 см",
        price: "2 600 ₽",
        status: "available",
        isNew: false,
        photos: ["plated21.jpg", "b-plated21.jpg"],
        desc: "Плоская сервировочная тарелка.",
        params: "• Доставка: Ozon / СДЭК / Яндекс<br>• Бронь 15 минут"
      }
    ];

    // Инициализация Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor('#545e54');
      if (tg.setBackgroundColor) tg.setBackgroundColor('#ece5d8');
    }

    // Отрисовка витрины
    const grid = document.getElementById('products-grid');
    products.forEach(p => {
      const isSold = p.status === 'sold';
      const card = document.createElement('div');
      card.className = `card ${isSold ? 'sold' : ''}`;
      
      let badgeHtml = '';
      if (isSold) {
        badgeHtml = '<span class="badge-sold">ПРОДАНО</span>';
      } else if (p.isNew) {
        badgeHtml = '<span class="badge-new">NEW</span>';
      }

      const orderUrl = `https://t.me/beezaly_order?text=${encodeURIComponent('Привет! Хочу забрать: ' + p.title)}`;

      card.innerHTML = `
        <div class="card-img-wrap" onclick="openModalById(${p.id})">
          <img src="${p.photos[0]}" alt="${p.title}" loading="lazy">
          ${badgeHtml}
        </div>
        <div class="card-info">
          <div class="card-title" onclick="openModalById(${p.id})">${p.title}</div>
          <div class="card-price">${isSold ? 'ПРОДАНО' : p.price}</div>
          <a class="card-btn" href="#" onclick="handleOrderClick(event, '${orderUrl}', ${isSold})">
            ${isSold ? 'Нет' : 'Заказать'}
          </a>
        </div>
      `;
      grid.appendChild(card);
    });

    function handleOrderClick(e, url, isSold) {
      e.preventDefault();
      if (isSold) return;
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(url);
      } else {
        window.location.href = url;
      }
    }

    function openModalById(id) {
      const item = products.find(p => p.id === id);
      if (item) openModal(item);
    }

    // Открытие шторки
    function openModal(item) {
      const modal = document.getElementById('modal');
      const gallery = document.getElementById('modal-gallery');
      gallery.innerHTML = item.photos.map(src => `<img src="${src}" alt="">`).join('');

      document.getElementById('modal-title').textContent = item.title;
      document.getElementById('modal-price').textContent = item.status === 'sold' ? 'ПРОДАНО' : item.price;
      document.getElementById('modal-desc').textContent = item.desc;
      document.getElementById('modal-params').innerHTML = item.params;

      const buyBtn = document.getElementById('modal-buy-btn');
      if (item.status === 'sold') {
        buyBtn.style.display = 'none';
      } else {
        buyBtn.style.display = 'block';
        const orderUrl = `https://t.me/beezaly_order?text=${encodeURIComponent('Привет! Хочу забрать: ' + item.title)}`;
        buyBtn.onclick = (e) => {
          e.preventDefault();
          if (tg && tg.openTelegramLink) {
            tg.openTelegramLink(orderUrl);
          } else {
            window.location.href = orderUrl;
          }
        };
      }

      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    document.getElementById('modal').onclick = (e) => {
      if (e.target.id === 'modal') closeModal();
    };
  </script>
</body>
</html>
